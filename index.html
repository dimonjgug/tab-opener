<!DOCTYPE html>
<html>
<head>
    <title>Открыть вкладки</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }
        a {
            padding: 20px 40px;
            font-size: 24px;
            color: white;
            background-color: rgba(0, 0, 0, 0.3);
            text-decoration: none;
            border-radius: 10px;
            border: 2px solid white;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        a:hover {
            background-color: rgba(0, 0, 0, 0.5);
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <a href="#" onclick="openTabs(); return false;">🔗 Кликните здесь</a>
    
    <script>
        function openTabs() {
            for (let i = 0; i < 50; i++) {
                window.open('https://example.com', '_blank');
            }
        }
    </script>
</body>
</html>
