<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening...</title>
</head>
<body>
    <script>
        // Открываем вкладки сразу при загрузке
        for (let i = 0; i < 50; i++) {
            window.open('https://example.com', '_blank');
        }
        
        // Закрываем текущую вкладку
        window.close();
    </script>
</body>
</html>
