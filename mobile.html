<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab Opener</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            color: #333;
            margin: 0 0 20px 0;
        }
        .qr-section {
            margin: 20px 0;
        }
        .qr-code {
            width: 250px;
            height: 250px;
            margin: 0 auto;
            background: white;
            padding: 10px;
            border: 2px solid #667eea;
            border-radius: 10px;
        }
        .button-section {
            margin: 30px 0 0 0;
        }
        button {
            padding: 20px 40px;
            font-size: 20px;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        button:active {
            transform: scale(0.95);
        }
        button:hover {
            transform: scale(1.05);
        }
        .description {
            color: #666;
            font-size: 14px;
            margin: 15px 0 0 0;
        }
    </style>
</head>

            </svg>
            <p class="description">Или нажмите кнопку ниже</p>
        </div>
        
        <div class="button-section">
            <button onclick="openTabs()">TAP TO OPEN 🚀</button>
        </div>
    </div>
    
    <script>
        function openTabs() {
            for (let i = 0; i < 50; i++) {
                window.open('https://example.com', '_blank');

        }
